<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CS2 Stat Site - Premier</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background-color: #181818;
            border-bottom: 1px solid #262626;
        }

        .logo {
            color: #00d2ff;
            font-size: 1.5rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-decoration: none;
        }

        nav {
            display: flex;
            gap: 25px;
        }

        nav a {
            color: #aaa;
            text-decoration: none;
            font-size: 1rem;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        nav a.active {
            color: #00d2ff;
        }

        nav a:hover {
            color: #00d2ff;
        }

        /* Головний контейнер у лівій частині, але розширений під дашборд */
        .main-container {
            padding: 30px 40px;
            display: flex;
            gap: 20px;
            align-items: flex-start;
            flex-wrap: wrap;
        }

        /* Твоя стара вузька картка (зліва) */
        .card {
            background-color: #1e1e1e;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.4);
            width: 100%;
            max-width: 300px;
        }

        .card h2 {
            margin-bottom: 20px;
            color: #e0e0e0;
            font-size: 1.3rem;
        }

        .stats-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .stat-box {
            background-color: #2a2a2a;
            padding: 12px 15px;
            border-radius: 8px;
            border-left: 4px solid #00d2ff;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .stat-label {
            font-size: 0.9rem;
            color: #aaa;
        }

        .stat-value {
            font-size: 1.2rem;
            font-weight: bold;
            color: #fff;
        }

        /* НОВЕ: Весь блок додаткової статистики в стилі csstats.gg (праворуч від твоєї картки) */
        .dashboard-section {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            flex: 1;
        }

        /* Великі картки для K/D та HLTV Rating з круглими колами */
        .big-stat-card {
            background-color: #1e1e1e;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 20px;
            width: 180px;
            text-align: center;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.4);
        }

        .big-stat-title {
            font-size: 0.9rem;
            color: #aaa;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .circle-stat {
            width: 110px;
            height: 110px;
            border: 4px solid #00d2ff;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
            background-color: #121212;
            box-shadow: inset 0 0 10px rgba(0, 210, 255, 0.2);
        }

        .circle-value {
            font-size: 1.6rem;
            font-weight: bold;
            color: #fff;
        }
        .circle-sub {
            font-size: 0.7rem;
            color: #666;
            margin-top: 2px;
        }

        /* Блок з сіткою додаткових показників (Win Rate, HS%, ADR тощо) */
        .extra-stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            flex: 1;
            min-width: 280px;
        }

        .extra-card {
            background-color: #1e1e1e;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.4);
        }

        .extra-card-title {
            font-size: 0.85rem;
            color: #aaa;
            margin-bottom: 8px;
        }

        .extra-card-value {
            font-size: 1.5rem;
            font-weight: bold;
            color: #00d2ff;
        }

        footer {
            text-align: center;
            color: #666;
            font-size: 0.9rem;
            padding: 20px;
            border-top: 1px solid #222;
            margin-top: auto;
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo">CS2 Stat Site</a>
        <nav>
            <a href="index.html" class="active">Premier</a>
            <a href="faceit.html">FACEIT</a>
        </nav>
    </header>

    <div class="main-container">
        
        <!-- Твоя оригінальна картка зліва (ми її залишили!) -->
        <main class="card">
            <h2>Premier Statistics</h2>
            <div class="stats-grid">
                <div class="stat-box">
                    <span class="stat-label">Rating</span>
                    <span class="stat-value" id="premierRating">--</span>
                </div>
                <div class="stat-box">
                    <span class="stat-label">Win Rate</span>
                    <span class="stat-value" id="premierWr">--</span>
                </div>
                <div class="stat-box">
                    <span class="stat-label">K/D Ratio</span>
                    <span class="stat-value" id="premierKd">--</span>
                </div>
                <div class="stat-box">
                    <span class="stat-label">Headshot %</span>
                    <span class="stat-value" id="premierHs">--</span>
                </div>
            </div>
        </main>

        <!-- НОВЕ: Блоки дашборду як на csstats.gg -->
        <div class="dashboard-section">
            
            <!-- K/D Колесо -->
            <div class="big-stat-card">
                <div class="big-stat-title">K / D</div>
                <div class="circle-stat" style="border-color: #00d2ff;">
                    <div class="circle-value">--</div>
                    <div class="circle-sub">ratio</div>
                </div>
            </div>

            <!-- HLTV Rating Колесо -->
            <div class="big-stat-card">
                <div class="big-stat-title">HLTV Rating</div>
                <div class="circle-stat" style="border-color: #2ecc71;">
                    <div class="circle-value">--</div>
                    <div class="circle-sub">rating</div>
                </div>
            </div>

            <!-- Додаткові квадрати статистики -->
            <div class="extra-stats-grid">
                <div class="extra-card">
                    <div class="extra-card-title">WIN RATE</div>
                    <div class="extra-card-value" style="color: #2ecc71;">--%</div>
                </div>
                <div class="extra-card">
                    <div class="extra-card-title">HEADSHOT %</div>
                    <div class="extra-card-value" style="color: #f1c40f;">--%</div>
                </div>
                <div class="extra-card">
                    <div class="extra-card-title">ADR</div>
                    <div class="extra-card-value" style="color: #e67e22;">--</div>
                </div>
                <div class="extra-card">
                    <div class="extra-card-title">KAST</div>
                    <div class="extra-card-value" style="color: #9b59b6;">--%</div>
                </div>
            </div>

        </div>

    </div>

    <footer>
        CS2 Stat Site © 2026
    </footer>

</body>
</html>
