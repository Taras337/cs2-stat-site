<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CS2 Stat Site - Premier</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background-color: #181818;
            border-bottom: 1px solid #262626;
        }

        .logo {
            color: #00d2ff;
            font-size: 1.5rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-decoration: none;
        }

        nav {
            display: flex;
            gap: 25px;
        }

        nav a {
            color: #aaa;
            text-decoration: none;
            font-size: 1rem;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        nav a.active {
            color: #00d2ff;
        }

        nav a:hover {
            color: #00d2ff;
        }

        .main-container {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            flex: 1;
        }

        .card {
            background-color: #1e1e1e;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.4);
            width: 100%;
            max-width: 600px;
        }

        .card h2 {
            margin-bottom: 20px;
            color: #e0e0e0;
            font-size: 1.5rem;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .stat-box {
            background-color: #2a2a2a;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #00d2ff;
        }

        .stat-label {
            font-size: 0.9rem;
            color: #aaa;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 1.4rem;
            font-weight: bold;
            color: #fff;
        }

        footer {
            text-align: center;
            color: #666;
            font-size: 0.9rem;
            padding: 20px;
            border-top: 1px solid #222;
        }

        @media (max-width: 600px) {
            header {
                flex-direction: column;
                gap: 15px;
                padding: 15px;
            }
            .stats-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo">CS2 Stat Site</a>
        <nav>
            <a href="index.html" class="active">Premier</a>
            <a href="faceit.html">FACEIT</a>
        </nav>
    </header>

    <div class="main-container">
        <main class="card">
            <h2>Premier Statistics</h2>
            <div class="stats-grid">
                <div class="stat-box">
                    <div class="stat-label">Rating</div>
                    <div class="stat-value" id="premierRating">--</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Win Rate</div>
                    <div class="stat-value" id="premierWr">--</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">K/D Ratio</div>
                    <div class="stat-value" id="premierKd">--</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Headshot %</div>
                    <div class="stat-value" id="premierHs">--</div>
                </div>
            </div>
        </main>
    </div>

    <footer>
        CS2 Stat Site © 2026
    </footer>

</body>
</html>
