<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CS2 Stat Site</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        header {
            margin: 20px 0;
            text-align: center;
        }

        h1 {
            color: #00d2ff;
            font-size: 2.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .container {
            display: flex;
            flex-direction: column;
            gap: 30px;
            width: 100%;
            max-width: 600px;
            margin-bottom: 30px;
        }

        .card {
            background-color: #1e1e1e;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.4);
            text-align: center;
        }

        .card h2 {
            margin-bottom: 20px;
            color: #e0e0e0;
            font-size: 1.5rem;
        }

        /* Стилі для блоку пошуку FACEIT */
        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        .search-input {
            flex: 1;
            background-color: #2a2a2a;
            border: 1px solid #444;
            border-radius: 6px;
            padding: 12px 15px;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s ease;
        }

        .search-input:focus {
            border-color: #ff5500;
        }

        .search-btn {
            background-color: #ff5500; /* Помаранчевий колір FACEIT */
            color: #fff;
            border: none;
            padding: 12px 20px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .search-btn:hover {
            background-color: #e04b00;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-box {
            background-color: #2a2a2a;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #00d2ff;
        }

        /* Особливий колір для лівої границі картки FACEIT */
        .card.faceit-card .stat-box {
            border-left-color: #ff5500;
        }

        .stat-label {
            font-size: 0.9rem;
            color: #aaa;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 1.4rem;
            font-weight: bold;
            color: #fff;
        }

        footer {
            color: #666;
            font-size: 0.9rem;
            margin-top: auto;
            padding-bottom: 10px;
        }

        /* Адаптивність для телефонів */
        @media (max-width: 480px) {
            .stats-grid {
                grid-template-columns: 1fr;
            }
            .search-box {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>CS2 Stat Site</h1>
    </header>

    <div class="container">
        <!-- ВЕРХНЯ КАРТКА: Premier -->
        <main class="card">
            <h2>Premier Statistics</h2>
            
            <div class="stats-grid">
                <div class="stat-box">
                    <div class="stat-label">Rating</div>
                    <div class="stat-value" id="premierRating">--</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Win Rate</div>
                    <div class="stat-value" id="premierWr">--</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">K/D Ratio</div>
                    <div class="stat-value" id="premierKd">--</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Headshot %</div>
                    <div class="stat-value" id="premierHs">--</div>
                </div>
            </div>
        </main>

        <!-- НИЖНЯ КАРТКА: FACEIT -->
        <section class="card faceit-card">
            <h2>FACEIT Statistics</h2>
            
            <div class="search-box">
                <input type="text" id="faceitNick" class="search-input" placeholder="Enter FACEIT nickname...">
                <button class="search-btn" onclick="searchFaceit()">Search</button>
            </div>

            <div class="stats-grid">
                <div class="stat-box">
                    <div class="stat-label">FACEIT Level</div>
                    <div class="stat-value" id="faceitLevel">--</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Elo</div>
                    <div class="stat-value" id="faceitElo">--</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">K/D Ratio</div>
                    <div class="stat-value" id="faceitKd">--</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Win Rate</div>
                    <div class="stat-value" id="faceitWr">--</div>
                </div>
            </div>
        </section>
    </div>

    <footer>
        CS2 Stat Site © 2026
    </footer>

    <script>
        function searchFaceit() {
            const nickname = document.getElementById('faceitNick').value;
            if (!nickname) {
                alert('Please enter a FACEIT nickname!');
                return;
            }
            console.log('Searching FACEIT player:', nickname);
            // Тут пізніше підключимо запит до FACEIT API
        }
    </script>

</body>
</html>
