<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CS2 Stat Site - FACEIT</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background-color: #181818;
            border-bottom: 1px solid #262626;
        }

        .logo {
            color: #00d2ff;
            font-size: 1.5rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-decoration: none;
        }

        nav {
            display: flex;
            gap: 25px;
        }

        nav a {
            color: #aaa;
            text-decoration: none;
            font-size: 1rem;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        nav a.active {
            color: #ff5500;
        }

        nav a:hover {
            color: #ff5500;
        }

        .main-container {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            flex: 1;
        }

        .card {
            background-color: #1e1e1e;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.4);
            width: 100%;
            max-width: 600px;
        }

        .card h2 {
            margin-bottom: 20px;
            color: #e0e0e0;
            font-size: 1.5rem;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        .search-input {
            flex: 1;
            background-color: #2a2a2a;
            border: 1px solid #444;
            border-radius: 6px;
            padding: 12px 15px;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s ease;
        }

        .search-input:focus {
            border-color: #ff5500;
        }

        .search-btn {
            background-color: #ff5500;
            color: #fff;
            border: none;
            padding: 12px 20px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .search-btn:hover {
            background-color: #e04b00;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .stat-box {
            background-color: #2a2a2a;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #ff5500;
        }

        .stat-label {
            font-size: 0.9rem;
            color: #aaa;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 1.4rem;
            font-weight: bold;
            color: #fff;
        }

        footer {
            text-align: center;
            color: #666;
            font-size: 0.9rem;
            padding: 20px;
            border-top: 1px solid #222;
        }

        @media (max-width: 600px) {
            header {
                flex-direction: column;
                gap: 15px;
                padding: 15px;
            }
            .stats-grid {
                grid-template-columns: 1fr;
            }
            .search-box {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
  header>
        <a href="index.html" class="logo">CS2 Stat Site</a>
        <nav>
            <a href="index.html">Premier</a>
            <a href="faceit.html" class="active">FACEIT</a>
        </nav>
    </header>

    <div class="main-container">
        <main class="card">
            <h2>FACEIT Statistics</h2>
            
            <div class="search-box">
                <input type="text" id="faceitNick" class="search-input" placeholder="Enter FACEIT nickname...">
                <button class="search-btn" onclick="searchFaceit()">Search</button>
            </div>

            <div class="stats-grid">
                <div class="stat-box">
                    <div class="stat-label">FACEIT Level</div>
                    <div class="stat-value" id="faceitLevel">--</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Elo</div>
                    <div class="stat-value" id="faceitElo">--</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">K/D Ratio</div>
                    <div class="stat-value" id="faceitKd">--</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Win Rate</div>
                    <div class="stat-value" id="faceitWr">--</div>
                </div>
            </div>
        </main>
    </div>

    <footer>
        CS2 Stat Site © 2026
    </footer>

    <script>
        function searchFaceit() {
            const nickname = document.getElementById('faceitNick').value;
            if (!nickname) {
                alert('Please enter a FACEIT nickname!');
                return;
            }
            console.log('Searching FACEIT player:', nickname);
        }
    </script>

</body>
</html>
