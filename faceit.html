<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CS2 Stat Site - FACEIT</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background-color: #181818;
            border-bottom: 1px solid #262626;
        }

        .logo {
            color: #00d2ff;
            font-size: 1.5rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-decoration: none;
        }

        nav {
            display: flex;
            gap: 25px;
        }

        nav a {
            color: #aaa;
            text-decoration: none;
            font-size: 1rem;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        nav a.active {
            color: #ff5500;
        }

        nav a:hover {
            color: #ff5500;
        }

        /* Контейнер вирівняний по лівому краю */
        .main-container {
            padding: 30px 40px;
            display: flex;
            justify-content: flex-start;
        }

        .card {
            background-color: #1e1e1e;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.4);
            width: 100%;
            max-width: 320px; /* Вузька картка */
        }

        .card h2 {
            margin-bottom: 20px;
            color: #e0e0e0;
            font-size: 1.3rem;
        }

        /* Сітка в один стовпчик (вниз) */
        .stats-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .stat-box {
            background-color: #2a2a2a;
            padding: 12px 15px;
            border-radius: 8px;
            border-left: 4px solid #ff5500;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .stat-label {
            font-size: 0.9rem;
            color: #aaa;
        }

        .stat-value {
            font-size: 1.2rem;
            font-weight: bold;
            color: #fff;
        }

        footer {
            text-align: center;
            color: #666;
            font-size: 0.9rem;
            padding: 20px;
            border-top: 1px solid #222;
            margin-top: auto;
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo">CS2 Stat Site</a>
        <nav>
            <a href="index.html">Premier</a>
            <a href="faceit.html" class="active">FACEIT</a>
        </nav>
    </header>

    <div class="main-container">
        <main class="card">
            <h2>FACEIT Statistics</h2>
            
            <div class="stats-grid">
                <div class="stat-box">
                    <span class="stat-label">FACEIT Level</span>
                    <span class="stat-value" id="faceitLevel">--</span>
                </div>
                <div class="stat-box">
                    <span class="stat-label">Elo</span>
                    <span class="stat-value" id="faceitElo">--</span>
                </div>
                <div class="stat-box">
                    <span class="stat-label">K/D Ratio</span>
                    <span class="stat-value" id="faceitKd">--</span>
                    </div>
                <div class="stat-box">
                    <span class="stat-label">Win Rate</span>
                    <span class="stat-value" id="faceitWr">--</span>
                </div>
            </div>
        </main>
    </div>

    <footer>
        CS2 Stat Site © 2026
    </footer>

</body>
</html>
